<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PokéRetro | Full Game Library</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root {
  --bg-color: #0f1015;
  --card-bg: #1c1e26;
  --primary-red: #ff3b30;
  --primary-yellow: #ffcc00;
  --text-main: #ffffff;
  --text-muted: #9ba1a6;
  --tag-official: #2a82da;
  --tag-hack: #8e44ad;
  --tag-gba: #16a085;
  --tag-gbc: #d35400;
  --tag-gb: #8bac0f;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-color: var(--bg-color);
  color: var(--text-main);
  background-image:
    radial-gradient(circle at 15% 50%, rgba(255, 59, 48, 0.07), transparent 25%),
    radial-gradient(circle at 85% 30%, rgba(255, 204, 0, 0.07), transparent 25%),
    radial-gradient(circle at 50% 80%, rgba(142, 68, 173, 0.05), transparent 30%);
  min-height: 100vh;
}

/* HEADER / NAVBAR -------------------------------------------------- */

header {
  position: sticky;
  top: 0;
  z-index: 50;
  padding: 0.9rem 5%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(15, 16, 21, 0.92);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.logo {
  font-family: 'Press Start 2P', cursive;
  font-size: 1.1rem;
  color: var(--text-main);
  text-transform: uppercase;
  letter-spacing: -1px;
  display: flex;
  align-items: center;
  gap: 0.35rem;
  text-decoration: none;
}

.logo span {
  color: var(--primary-red);
}

.main-nav {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 2rem;
}

.nav-link {
  font-size: 0.78rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 600;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  transition: all 0.3s ease;
  position: relative;
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: -2px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 2px;
  background: var(--primary-yellow);
  transition: width 0.3s ease;
  border-radius: 2px;
}

.nav-link:hover::after,
.nav-link-active::after {
  width: 80%;
}

.nav-link:hover,
.nav-link-active {
  color: var(--primary-yellow);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

/* Auth (logged out) */

.auth-logged-out {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.btn-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.45rem 1.1rem;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  cursor: pointer;
  text-decoration: none;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.btn-pill.primary {
  background: var(--primary-red);
  border-color: rgba(255, 255, 255, 0.12);
  color: #fff;
  box-shadow: 0 6px 18px rgba(255, 59, 48, 0.35);
}

.btn-pill.ghost {
  background: transparent;
  border-color: rgba(255, 255, 255, 0.2);
  color: var(--text-main);
}

.btn-pill:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
}

/* Auth (logged in) */

.user-area {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.08);
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--primary-yellow);
}

.user-info {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-size: 0.8rem;
  font-weight: 600;
}

.logout-btn {
  background: none;
  border: none;
  padding: 0;
  margin: 0;
  font-size: 0.72rem;
  color: var(--text-muted);
  cursor: pointer;
  text-align: left;
}

.logout-btn:hover {
  color: var(--primary-yellow);
}

.hidden {
  display: none !important;
}

/* LIBRARY HEADER --------------------------------------------------- */

h1, h2 {
  font-family: 'Press Start 2P', cursive;
  line-height: 1.4;
}

.lib-header {
  text-align: center;
  padding: 5rem 1rem 3rem;
  max-width: 900px;
  margin: 0 auto;
  position: relative;
}

.lib-header h1 {
  font-size: 2rem;
  margin-bottom: 1rem;
  background: linear-gradient(135deg, var(--text-main) 0%, var(--primary-yellow) 50%, var(--primary-red) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientShift 5s ease infinite;
  background-size: 200% 200%;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.lib-header p {
  font-size: 1.05rem;
  color: var(--text-muted);
  line-height: 1.7;
}

/* SEARCH BAR ------------------------------------------------------- */

.search-container {
  max-width: 500px;
  margin: 2rem auto 0;
  position: relative;
}

.search-input {
  width: 100%;
  padding: 1rem 1.5rem 1rem 3rem;
  background: var(--card-bg);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 50px;
  color: var(--text-main);
  font-size: 0.95rem;
  outline: none;
  transition: all 0.3s ease;
}

.search-input:focus {
  border-color: var(--primary-red);
  box-shadow: 0 0 20px rgba(255, 59, 48, 0.2);
}

.search-input::placeholder {
  color: var(--text-muted);
}

.search-icon {
  position: absolute;
  left: 1.2rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 1rem;
  pointer-events: none;
}

/* GAME COUNT ------------------------------------------------------- */

.game-count {
  text-align: center;
  padding: 1rem 0 0;
  color: var(--text-muted);
  font-size: 0.85rem;
}

.game-count span {
  color: var(--primary-yellow);
  font-weight: 700;
}

/* FILTERS ---------------------------------------------------------- */

.filters {
  display: flex;
  justify-content: center;
  gap: 0.8rem;
  flex-wrap: wrap;
  padding: 2rem 5% 3rem;
}

.filter-btn {
  background: rgba(17, 17, 23, 0.9);
  color: var(--text-main);
  border: 1px solid rgba(255, 255, 255, 0.08);
  padding: 0.65rem 1.4rem;
  border-radius: 999px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 0.85rem;
}

.filter-btn:hover {
  border-color: rgba(255, 255, 255, 0.2);
  background: rgba(255, 140, 0, 0.2);
  transform: translateY(-2px);
}

.filter-btn.active {
  background: var(--primary-red);
  box-shadow: 0 4px 18px rgba(255, 59, 48, 0.5);
  border-color: var(--primary-red);
}

/* GAMES GRID ------------------------------------------------------- */

.games-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 2rem;
  padding: 0 5% 5rem;
  max-width: 1400px;
  margin: 0 auto;
}

/* FIX FOR HOVER STUTTERING */
.game-card {
  background: var(--card-bg);
  border-radius: 16px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.05);
  
  /* Prevent stuttering */
  will-change: transform;
  transform: translateY(0) translateZ(0);
  backface-visibility: hidden;
  -webkit-font-smoothing: subpixel-antialiased;
  
  /* Smooth transitions */
  transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94), 
              box-shadow 0.4s ease, 
              border-color 0.3s ease;
  
  /* Create stacking context */
  position: relative;
  z-index: 1;
}

.game-card:hover {
  transform: translateY(-12px) translateZ(0);
  box-shadow: 
    0 20px 40px rgba(0, 0, 0, 0.5),
    0 0 0 1px var(--primary-red),
    0 0 30px rgba(255, 59, 48, 0.15);
  border-color: var(--primary-red);
  z-index: 2;
}

.card-image {
  height: 160px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
}

.card-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  will-change: transform;
}

.game-card:hover .card-image img {
  transform: scale(1.1);
}

.card-image::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 70%;
  background: linear-gradient(to top, var(--card-bg) 0%, transparent 100%);
  pointer-events: none;
}

/* Card glow effect on hover */
.game-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  border-radius: 16px;
  background: linear-gradient(135deg, 
    rgba(255, 59, 48, 0.1) 0%, 
    transparent 50%, 
    rgba(255, 204, 0, 0.1) 100%);
  opacity: 0;
  transition: opacity 0.4s ease;
  pointer-events: none;
  z-index: 0;
}

.game-card:hover::before {
  opacity: 1;
}

.card-content {
  padding: 1.4rem 1.5rem 1.5rem;
  position: relative;
  z-index: 1;
}

.card-content h4 {
  font-size: 1rem;
  margin-bottom: 1rem;
  font-weight: 800;
  line-height: 1.3;
}

.tags {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
}

.tag {
  font-size: 0.7rem;
  padding: 0.3rem 0.7rem;
  border-radius: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.tag.official { background: rgba(42, 130, 218, 0.2); color: #5bc0eb; border: 1px solid rgba(42, 130, 218, 0.4); }
.tag.hack     { background: rgba(142, 68, 173, 0.2); color: #cd84f1; border: 1px solid rgba(142, 68, 173, 0.4); }
.tag.gba      { background: rgba(22, 160, 133, 0.2); color: #1abc9c; border: 1px solid rgba(22, 160, 133, 0.4); }
.tag.gbc      { background: rgba(211, 84, 0, 0.2); color: #f39c12; border: 1px solid rgba(211, 84, 0, 0.4); }
.tag.gb       { background: rgba(139, 172, 15, 0.2); color: #9bbc0f; border: 1px solid rgba(139, 172, 15, 0.4); }

.play-btn {
  width: 100%;
  padding: 0.8rem;
  background: rgba(255, 255, 255, 0.05);
  color: var(--text-main);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 8px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 0.8rem;
}

.game-card:hover .play-btn {
  background: var(--primary-yellow);
  color: #000;
  border-color: var(--primary-yellow);
  box-shadow: 0 4px 15px rgba(255, 204, 0, 0.3);
}

/* EMPTY STATE ------------------------------------------------------ */

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-muted);
}

.empty-state h3 {
  font-family: 'Press Start 2P', cursive;
  font-size: 1rem;
  margin-bottom: 1rem;
  color: var(--text-main);
}

/* FOOTER ----------------------------------------------------------- */

footer {
  text-align: center;
  padding: 3rem;
  border-top: 1px solid rgba(255, 255, 255, 0.05);
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* ANIMATIONS ------------------------------------------------------- */

@keyframes fadeInUp {
  from { 
    opacity: 0; 
    transform: translateY(30px) translateZ(0); 
  }
  to { 
    opacity: 1; 
    transform: translateY(0) translateZ(0); 
  }
}

.game-card {
  animation: fadeInUp 0.5s ease forwards;
  opacity: 0;
}

/* SCROLLBAR -------------------------------------------------------- */

::-webkit-scrollbar {
  width: 10px;
}

::-webkit-scrollbar-track {
  background: var(--bg-color);
}

::-webkit-scrollbar-thumb {
  background: var(--card-bg);
  border-radius: 5px;
  border: 2px solid var(--bg-color);
}

::-webkit-scrollbar-thumb:hover {
  background: var(--primary-red);
}

/* RESPONSIVE ------------------------------------------------------- */

@media (max-width: 900px) {
  .lib-header h1 { font-size: 1.5rem; }
}

@media (max-width: 768px) {
  header {
    padding: 0.7rem 4%;
    gap: 0.75rem;
  }

  .main-nav {
    position: static;
    transform: none;
    gap: 1rem;
  }

  .logo {
    font-size: 0.9rem;
  }

  .nav-link {
    font-size: 0.7rem;
    padding: 0.4rem 0.6rem;
  }

  .auth-logged-out {
    gap: 0.3rem;
  }

  .btn-pill {
    padding: 0.4rem 0.8rem;
    font-size: 0.65rem;
  }

  .lib-header {
    padding-top: 3rem;
  }

  .games-grid {
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1.5rem;
  }
}

@media (max-width: 480px) {
  .main-nav {
    display: none;
  }

  .user-info {
    display: none;
  }

  .user-area {
    padding: 0.2rem;
    background: transparent;
    border: none;
  }

  .filters {
    gap: 0.5rem;
    padding: 1.5rem 3% 2rem;
  }

  .filter-btn {
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
  }
}
</style>

  function setUser(user) {
    if (user) {
      authLoggedOut.classList.add('hidden');
      authLoggedIn.classList.remove('hidden');

      const meta = user.user_metadata || {};
      const avatarObj = meta.avatar || null;

      const name =

      authLoggedIn.classList.add('hidden');
      userAvatarEl.src = '';
      userNameEl.textContent = '';
    }
  }

  async function refreshUser() {
    const { data, error } = await supabase.auth.getUser();
    if (error) {
      console.error('Error fetching user:', error.message);
      setUser(null);
      return;
    }
    setUser(data.user);
  }

  supabase.auth.onAuthStateChange((_event, session) => {
    setUser(session?.user ?? null);

    { title: "Pokémon Seaglass", type: "hack", console: "gba", image: "./images/sea.jpeg", url: "./summary/sea-glass-summary.html" },
    { title: "Pokémon Horizons", type: "hack", console: "gba", image: "./images/horizons.jpg", url: "./summary/horizons-summary.html" },
    { title: "Pokémon Emerald Enhanced", type: "hack", console: "gba", image: "./images/enhanced.jpeg", url: "./summary/emerald-enhanced-summary.html" },
    /* ✅ FIXED: removed trailing spaces + added missing comma */
    { title: "Pokémon Emerald Crest", type: "hack", console: "gba", image: "./images/crest.jpg", url: "./summary/crest-summary.html" },
    { title: "Pokémon Elite Redux", type: "hack", console: "gba", image: "./images/elite.jpg", url: "./summary/elte-summary.html" },
    { title: "Pokémon Dreamstone Mysteries", type: "hack", console: "gba", image: "./images/dreamstone.jpg", url: "./summary/dream-stone-summary.html" },
    { title: "Pokémon Crystal Redux Advanced", type: "hack", console: "gba", image: "./images/crystal-redux.jpeg", url: "./summary/advanced-redux-summary.html" },
  ];

  /* ------------------------ DOM ELEMENTS -------------------------- */

  const grid = document.getElementById('games-grid');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const searchInput = document.getElementById('search-input');
  const gameCountEl = document.getElementById('game-count');

  let currentFilter = 'all';
  let searchQuery = '';

  /* ------------------------ RENDER GAMES -------------------------- */

  function renderGames() {
    grid.innerHTML = '';

    let filtered = games;

    if (currentFilter !== 'all') {
      filtered = filtered.filter(g => g.type === currentFilter || g.console === currentFilter);
    }

    if (searchQuery) {
      filtered = filtered.filter(g =>
        g.title.toLowerCase().includes(searchQuery.toLowerCase())
      );
    }

    if (gameCountEl) gameCountEl.textContent = filtered.length;

    if (filtered.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <h3>No Games Found</h3>
          <p>Try adjusting your search or filter.</p>
        </div>
      `;
      return;
    }

    filtered.forEach((game, index) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.style.animationDelay = `${index * 0.05}s`;

      card.innerHTML = `
        <div class="card-image">
          <img src="${game.image}" alt="${game.title}" loading="lazy">
        </div>
        <div class="card-content">
          <h4>${game.title}</h4>
          <div class="tags">
            <span class="tag ${game.type}">${game.type}</span>
            <span class="tag ${game.console}">${game.console.toUpperCase()}</span>
          </div>
          <a href="${game.url}" style="text-decoration: none;">
            <button class="play-btn">Play Now</button>
          </a>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  /* ------------------------ EVENT LISTENERS ----------------------- */

  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('.filter-btn.active')?.classList.remove('active');
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderGames();
    });
  });

  let searchTimeout;
  if (searchInput) {
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = e.target.value.trim();
        renderGames();
      }, 200);
    });
  }

  renderGames();
</script>
</body>
</html>
