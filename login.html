<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PokéRetro</title>
    <link rel="icon" type="image/x-icon" href="./Master-Ball.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Supabase UMD (global `supabase`) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #0a0e27;
            --card-bg: #1a1f3a;
            --primary-red: #ff3b30;
            --primary-yellow: #ffcc00;
            --primary-blue: #4a9eff;
            --primary-green: #4cd964;
            --text-main: #ffffff;
            --text-muted: #9ba1b7;
            --psychic-glow: #a136ff;
            --electric-glow: #f7d51d;
            --mewtwo-card-bg: #1a0b2e;
        }
        * { 
            box-sizing: border-box; 
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f0420 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow-x: hidden;
            padding: 2rem 0;
            position: relative;
        }

        /* Animated Background Elements */
        .bg-decoration {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .floating-pokeball {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 59, 48, 0.3), rgba(255, 59, 48, 0.05));
            border-radius: 50%;
            animation: float 20s infinite ease-in-out;
            opacity: 0.4;
            filter: blur(1px);
        }

        .floating-pokeball:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .floating-pokeball:nth-child(2) { top: 70%; left: 80%; animation-delay: 3s; width: 60px; height: 60px; }
        .floating-pokeball:nth-child(3) { top: 30%; left: 70%; animation-delay: 6s; width: 30px; height: 30px; }
        .floating-pokeball:nth-child(4) { top: 80%; left: 20%; animation-delay: 9s; width: 50px; height: 50px; }
        .floating-pokeball:nth-child(5) { top: 20%; left: 50%; animation-delay: 12s; width: 35px; height: 35px; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            25% { transform: translateY(-30px) rotate(90deg); }
            50% { transform: translateY(-60px) rotate(180deg); }
            75% { transform: translateY(-30px) rotate(270deg); }
        }

        .glow-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: pulse 8s infinite ease-in-out;
        }

        .glow-orb.red {
            width: 400px;
            height: 400px;
            background: var(--primary-red);
            top: -100px;
            left: -100px;
        }

        .glow-orb.purple {
            width: 500px;
            height: 500px;
            background: var(--psychic-glow);
            bottom: -150px;
            right: -150px;
            animation-delay: 2s;
        }

        .glow-orb.yellow {
            width: 300px;
            height: 300px;
            background: var(--electric-glow);
            top: 50%;
            left: 50%;
            animation-delay: 4s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.15; }
            50% { transform: scale(1.3); opacity: 0.25; }
        }

        /* Loader ---------------------------------------------------- */
        .loader-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.98), rgba(26, 11, 46, 0.98));
            backdrop-filter: blur(10px);
            display: none; 
            justify-content: center; 
            align-items: center;
            z-index: 9999; 
            flex-direction: column;
        }
        
        .pokeball {
            width: 80px; 
            height: 80px;
            background: linear-gradient(to bottom, #fff 50%, #fff 50%);
            border: 4px solid #222;
            border-radius: 50%; 
            position: relative;
            animation: spin 1s linear infinite, bounce 0.6s infinite alternate;
            box-shadow: 0 10px 40px rgba(255, 59, 48, 0.5);
        }
        
        .pokeball::before {
            content: ""; 
            position: absolute;
            background: linear-gradient(to bottom, var(--primary-red), #cc0000);
            width: 100%; 
            height: 50%;
            border-radius: 40px 40px 0 0; 
            border-bottom: 4px solid #222;
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.3);
        }
        
        .pokeball::after {
            content: ""; 
            position: absolute; 
            top: 50%; 
            left: 50%;
            width: 20px; 
            height: 20px; 
            background: #fff;
            border: 4px solid #222; 
            border-radius: 50%;
            transform: translate(-50%, -50%); 
            z-index: 10;
            box-shadow: 0 0 0 3px #666, inset 0 2px 5px rgba(0,0,0,0.3);
        }
        
        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }
        
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .loader-text {
            font-family: 'Press Start 2P'; 
            font-size: 0.8rem; 
            margin-top: 30px;
            color: var(--primary-yellow);
            text-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
            animation: textPulse 1.5s infinite;
        }

        @keyframes textPulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Layout ---------------------------------------------------- */
        .login-wrapper {
            display: flex;
            align-items: stretch;
            justify-content: center;
            gap: 4rem;
            max-width: 1400px;
            width: 95%;
            padding: 0;
            position: relative;
            z-index: 1;
            animation: fadeUp 0.6s ease-out;
        }

        .art-side {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .mewtwo-card {
            position: relative;
            max-width: 500px;
            width: 100%;
            animation: cardFloat 6s ease-in-out infinite, fadeUp 0.8s ease-out;
            filter: drop-shadow(0 20px 60px rgba(161, 54, 255, 0.6));
        }

        /* Mewtwo card energy rings */
        .energy-ring {
            position: absolute;
            border-radius: 50%;
            border: 2px solid var(--psychic-glow);
            opacity: 0;
            animation: energyPulse 3s infinite ease-out;
        }

        .energy-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 0s;
        }

        .energy-ring:nth-child(2) {
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 1s;
        }

        .energy-ring:nth-child(3) {
            width: 100%;
            height: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 2s;
        }

        @keyframes energyPulse {
            0% {
                opacity: 0.8;
                transform: translate(-50%, -50%) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.5);
            }
        }

        @keyframes cardFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        .art-side img {
            width: 100%;
            max-width: 450px;
            filter: 
                drop-shadow(0 0 60px var(--psychic-glow)) 
                drop-shadow(0 0 100px rgba(161, 54, 255, 0.5))
                drop-shadow(0 30px 80px rgba(0, 0, 0, 0.8));
            display: block;
            animation: mewtwoFloat 4s ease-in-out infinite;
            position: relative;
            z-index: 2;
        }

        @keyframes mewtwoFloat {
            0%, 100% { 
                transform: translateY(0) scale(1); 
                filter: 
                    drop-shadow(0 0 60px var(--psychic-glow)) 
                    drop-shadow(0 0 100px rgba(161, 54, 255, 0.5))
                    drop-shadow(0 30px 80px rgba(0, 0, 0, 0.8));
            }
            50% { 
                transform: translateY(-15px) scale(1.02); 
                filter: 
                    drop-shadow(0 0 80px var(--psychic-glow)) 
                    drop-shadow(0 0 120px rgba(161, 54, 255, 0.7))
                    drop-shadow(0 40px 100px rgba(0, 0, 0, 0.9));
            }
        }

        .login-card {
            flex: 1.2;
            max-width: 700px;
            background: 
                linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)),
                rgba(26, 31, 58, 0.7);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4rem 4.5rem;
            box-shadow: 
                0 40px 100px rgba(0, 0, 0, 0.9),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeUp 0.8s ease-out 0.2s both;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Header ---------------------------------------------------- */
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            position: relative;
        }

        .login-header h1 {
            font-family: 'Press Start 2P', cursive;
            font-size: 2rem;
            margin: 0;
            background: linear-gradient(135deg, #fff, var(--primary-yellow), var(--primary-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.3));
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 204, 0, 0.3)); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 59, 48, 0.5)); }
        }

        .login-header h1 span {
            color: var(--primary-red);
            margin-left: 0.5rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
            letter-spacing: 0.05em;
        }

        /* Status message -------------------------------------------- */
        .status-message {
            margin: 0 auto 1.8rem;
            font-size: 0.65rem;
            font-family: 'Press Start 2P', cursive;
            text-align: center;
            padding: 1rem 1.5rem;
            border-radius: 16px;
            border: 2px solid transparent;
            display: none;
            max-width: 100%;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative;
            overflow: hidden;
        }

        .status-message::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: statusShimmer 2s infinite;
        }

        @keyframes statusShimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .status-message.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: statusPop 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes statusPop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .status-message.success {
            display: block;
            color: var(--primary-green);
            background: linear-gradient(135deg, rgba(76, 217, 100, 0.15), rgba(76, 217, 100, 0.05));
            border-color: rgba(76, 217, 100, 0.7);
            box-shadow: 0 10px 30px rgba(76, 217, 100, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .status-message.error {
            display: block;
            color: #ff6b6b;
            background: linear-gradient(135deg, rgba(255, 59, 48, 0.15), rgba(255, 59, 48, 0.05));
            border-color: rgba(255, 59, 48, 0.7);
            box-shadow: 0 10px 30px rgba(255, 59, 48, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        /* Form fields ----------------------------------------------- */
        .form-group { 
            margin-bottom: 1.8rem; 
            width: 100%;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-family: 'Press Start 2P', cursive;
            margin-bottom: 1rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: color 0.3s;
        }

        .form-group:focus-within label {
            color: var(--primary-red);
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1.3rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            pointer-events: none;
            transition: all 0.3s;
            opacity: 0.5;
        }

        .form-group input {
            width: 100%;
            padding: 1.4rem 1.5rem 1.4rem 3.5rem;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: white;
            outline: none;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }

        .form-group input::placeholder {
            color: rgba(155, 161, 183, 0.4);
        }

        .form-group input:focus {
            border-color: var(--primary-red);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 
                0 0 0 4px rgba(255, 59, 48, 0.2),
                0 10px 30px rgba(255, 59, 48, 0.3);
            transform: translateY(-2px);
        }

        .form-group input:focus + .input-icon {
            color: var(--primary-red);
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }

        /* Password Toggle */
        #togglePassword {
            position: absolute;
            right: 1.3rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.6rem;
            font-family: 'Press Start 2P';
            padding: 0.5rem 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #togglePassword:hover {
            background: rgba(255, 59, 48, 0.2);
            color: var(--primary-red);
            border-color: var(--primary-red);
            transform: translateY(-50%) scale(1.05);
        }

        /* Buttons --------------------------------------------------- */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            margin-top: 2.5rem;
        }

        .btn {
            width: 100%;
            padding: 1.5rem 2rem;
            border-radius: 16px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            text-decoration: none;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn span {
            position: relative;
            z-index: 1;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary-red) 0%, #ff6b6b 100%);
            color: #fff;
            box-shadow: 
                0 10px 30px rgba(255, 59, 48, 0.4),
                0 0 60px rgba(255, 59, 48, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(255, 59, 48, 0.5),
                0 0 80px rgba(255, 59, 48, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .submit-btn:active:not(:disabled) {
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .register-btn {
            background: linear-gradient(135deg, rgba(255, 204, 0, 0.1), rgba(255, 204, 0, 0.05));
            color: var(--primary-yellow);
            border: 2px solid rgba(255, 204, 0, 0.5);
            box-shadow: 
                0 10px 30px rgba(255, 204, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .register-btn:hover {
            border-color: var(--primary-yellow);
            background: linear-gradient(135deg, rgba(255, 204, 0, 0.2), rgba(255, 204, 0, 0.1));
            box-shadow: 
                0 15px 40px rgba(255, 204, 0, 0.3),
                0 0 60px rgba(255, 204, 0, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: translateY(-3px);
        }

        /* Animations ------------------------------------------------ */
        @keyframes fadeUp {
            from { 
                opacity: 0; 
                transform: translateY(30px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        /* Responsive Design ----------------------------------------- */
        @media (max-width: 1200px) {
            .login-wrapper {
                gap: 3rem;
            }
            .mewtwo-card {
                max-width: 400px;
            }
        }

        @media (max-width: 1000px) {
            .login-wrapper {
                flex-direction: column;
                gap: 3rem;
                padding: 1.5rem;
            }
            .login-card {
                max-width: 100%;
                padding: 3rem 2.5rem;
            }
            .art-side {
                order: -1;
            }
            .mewtwo-card {
                max-width: 100%;
            }
        }

        @media (max-width: 600px) {
            .login-card {
                padding: 2rem 1.5rem;
            }
            .login-header h1 { 
                font-size: 1.2rem; 
            }
            .login-header p {
                font-size: 0.85rem;
            }
            .btn {
                padding: 1.2rem 1.5rem;
                font-size: 0.65rem;
            }
            .form-group input {
                padding: 1.2rem 1.2rem 1.2rem 3rem;
            }
            .glow-orb {
                display: none;
            }
        }
    </style>
</head>
<body>

<!-- Animated Background -->
<div class="bg-decoration">
    <div class="glow-orb red"></div>
    <div class="glow-orb purple"></div>
    <div class="glow-orb yellow"></div>
    <div class="floating-pokeball"></div>
    <div class="floating-pokeball"></div>
    <div class="floating-pokeball"></div>
    <div class="floating-pokeball"></div>
    <div class="floating-pokeball"></div>
</div>

<div class="loader-overlay" id="loader">
    <div class="pokeball"></div>
    <p class="loader-text">LOGGING IN...</p>
</div>

<div class="login-wrapper">
    <div class="art-side">
        <div class="mewtwo-card">
            <div class="energy-ring"></div>
            <div class="energy-ring"></div>
            <div class="energy-ring"></div>
            <img src="./mewtwo.png" alt="Mewtwo">
        </div>
    </div>

    <div class="login-card">
        <form id="loginForm" autocomplete="on">
            <div class="login-header">
                <h1>POKÉ<span>RETRO</span></h1>
                <p>Access your trainer data.</p>
            </div>

            <div id="formStatus" class="status-message"></div>

            <div class="form-group">
                <label for="email">EMAIL ADDRESS</label>
                <div class="input-wrapper">
                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="ash.ketchum@pallet.com"
                        required
                    >
                    <span class="input-icon">✉</span>
                </div>
            </div>

            <div class="form-group">
                <label for="trainerName">TRAINER NAME</label>
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="trainerName"
                        name="username"
                        autocomplete="username"
                        placeholder="e.g. Red_96"
                        required
                    >
                    <span class="input-icon">👤</span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">PASSCODE</label>
                <div class="input-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="current-password"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                    >
                    <span class="input-icon">🔒</span>
                    <span id="togglePassword">SHOW</span>
                </div>
            </div>

            <div class="btn-container">
                <button type="submit" id="submit-btn" class="btn submit-btn">
                    <span>SIGN IN</span>
                </button>
                <a href="signup.html" class="btn register-btn">
                    <span>NEW TRAINER? CREATE ACCOUNT</span>
                </a>
            </div>
        </form>
    </div>
</div>

    const loader = document.getElementById('loader');
    const formStatus = document.getElementById('formStatus');
    const emailInput = document.getElementById('email');
    const trainerNameInput = document.getElementById('trainerName');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const submitBtn = document.getElementById('submit-btn');

    function setStatus(message, type) {
        if (!message) {
            formStatus.textContent = '';
            formStatus.className = 'status-message';
            formStatus.style.display = 'none';
            return;
        }
        formStatus.textContent = message;
        formStatus.className = 'status-message ' + type + ' show';
        formStatus.style.display = 'block';
    }

    togglePassword.onclick = () => {
        const isPass = passwordInput.type === 'password';
        passwordInput.type = isPass ? 'text' : 'password';
        togglePassword.innerText = isPass ? 'HIDE' : 'SHOW';
    };

    loginForm.onsubmit = async (e) => {
        e.preventDefault();
        setStatus('', '');
        submitBtn.disabled = true;

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const trainerName = trainerNameInput.value.trim();

        if (!email || !password || !trainerName) {
            submitBtn.disabled = false;
            setStatus('PLEASE FILL IN ALL FIELDS.', 'error');
            return;
        }

        loader.style.display = 'flex';

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                loader.style.display = 'none';
                submitBtn.disabled = false;

                const msg = error.message.toLowerCase();
                if (msg.includes('invalid login credentials')) {
                    setStatus('INVALID EMAIL OR PASSCODE.', 'error');
                } else {
                    setStatus('LOGIN ERROR: ' + error.message.toUpperCase(), 'error');
                }
                return;
            }

            loader.style.display = 'none';
            submitBtn.disabled = false;

            setStatus('WELCOME BACK, TRAINER!', 'success');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);

        } catch (err) {
            loader.style.display = 'none';
            submitBtn.disabled = false;
            console.error('Unexpected login error:', err);
            setStatus('UNEXPECTED ERROR. CHECK CONSOLE FOR DETAILS.', 'error');
        }
    };
};
</script>
</body>
</html>
